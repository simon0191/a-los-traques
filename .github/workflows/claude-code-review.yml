name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the A Los Traques fighting game repo.
            Read CLAUDE.md first to learn the monorepo layout and conventions, then focus on:

            - Correctness: bugs, edge cases, race conditions, broken types
            - Determinism: changes to `packages/sim/` or any code on the simulation tick path
              must stay deterministic (no `Date.now()`, `Math.random()`, `setTimeout`, no
              direct Phaser/audio side effects in sim code — those belong in bridges)
            - Conventions: named exports, `Logger.create()` instead of `console.*`, pure-sim
              imports go through `@alostraques/sim`, no cross-app `../../apps/*` imports
            - Security: auth middleware on new API routes, input validation, no secrets in code
            - Tests: meaningful coverage for new logic in `tests/`

            Leave inline comments on specific lines for concrete issues. Use a top-level
            summary for overall feedback. Skip nits unless they affect correctness or
            readability. If the PR looks good, say so plainly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
